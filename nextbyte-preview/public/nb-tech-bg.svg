<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#020509"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%"  stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="55%"  stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon-halo" cx="50%" cy="0%" r="100%">
      <stop offset="0%"   stop-color="#0ea5e9" stop-opacity="0.7"/>
      <stop offset="40%"  stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <!-- Fade siatki: jasna przy horyzoncie, ciemna na dole -->
    <linearGradient id="gfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.06"/>
    </linearGradient>
    <!-- Fade siatki dla linii poziomych -->
    <linearGradient id="hfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.05"/>
      <stop offset="20%"  stop-color="#00d4ff" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#00d4ff" stop-opacity="0.7"/>
      <stop offset="80%"  stop-color="#00d4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Tło -->
  <rect width="1440" height="900" fill="url(#sky)"/>

  <!-- Subtelna fioletowa poświata z góry -->
  <ellipse cx="720" cy="200" rx="600" ry="300" fill="#4f46e5" opacity="0.08"/>
